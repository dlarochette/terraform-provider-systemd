name: ci

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: go test ./...
      - run: go build -o bin/terraform-provider-systemd .

  testacc:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install nspawn tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd-container debootstrap dbus
      - name: Acceptance tests (nspawn)
        run: make testacc

  testacc-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install nspawn + openssh tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y systemd-container debootstrap dbus openssh-client
      - name: Acceptance tests (SSH into nspawn guest)
        run: make testacc-ssh

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, testacc, testacc-ssh]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
